# Source: a2a-server/templates/harvester-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: a2a-server-harvester
  labels:
    helm.sh/chart: a2a-server-1.4.3
    app.kubernetes.io/name: a2a-server
    app.kubernetes.io/instance: a2a-server
    app.kubernetes.io/version: "1.4.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: codetether
    app.kubernetes.io/component: harvester
spec:
  serviceName: a2a-server-harvester
  replicas: 0
  # Drain legacy workers without restarting active tasks during the Job cutover.
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a-server
      app.kubernetes.io/instance: a2a-server
      app.kubernetes.io/component: harvester
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-server
        app.kubernetes.io/instance: a2a-server
        app.kubernetes.io/component: harvester
      annotations:
        checksum/config: 2ffc5da24c8abd5c852a0fef48f06753a86b7891fd521393b8482a3a06e36669
    spec:
      serviceAccountName: a2a-server-harvester
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        # Harvester workspaces are per-repository clones on a node-local volume.
        # Without bounded retention they accumulate until the node crosses
        # kubelet's DiskPressure threshold, which taints the node and leaves the
        # harvester Pending, so queued tasks are accepted and never executed.
        # This sidecar reclaims only clones that are older than the retention
        # window AND have no uncommitted, unpushed, or stashed work.
        - name: workspace-reclaim
          image: "registry.quantum-forge.net/cluster-ci-cache/codetether-worker:4.7.5-dev.49-forgejo-ro-599230d97ec3"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -u
              root=/var/lib/codetether/repos
              retain_days=3
              interval=3600
              min_free_pct=20
              git config --global --add safe.directory '*' >/dev/null 2>&1 || true
              while true; do
                free_pct=$(df -P "$root" | awk 'NR==2 {print 100 - int($5)}')
                echo "workspace-reclaim: free=${free_pct}% threshold=${min_free_pct}%"
                if [ "$free_pct" -lt "$min_free_pct" ]; then
                  find "$root" -maxdepth 1 -mindepth 1 -type d -mtime "+${retain_days}" 2>/dev/null |
                  while read -r ws; do
                    name=$(basename "$ws")
                    case "$name" in .*) continue ;; esac
                    gd=$(find "$ws" -maxdepth 2 -name .git -type d 2>/dev/null | head -1)
                    if [ -n "$gd" ]; then
                      wt=$(dirname "$gd")
                      dirty=$(git -C "$wt" status --porcelain 2>/dev/null | wc -l)
                      unpushed=$(git -C "$wt" log --branches --not --remotes --oneline 2>/dev/null | wc -l)
                      stash=$(git -C "$wt" stash list 2>/dev/null | wc -l)
                      readable=$(git -C "$wt" rev-parse --is-inside-work-tree 2>/dev/null || echo no)
                      # Preserve anything unreadable or carrying unsaved work.
                      if [ "$readable" != true ] ||
                         [ "$dirty" -ne 0 ] || [ "$unpushed" -ne 0 ] || [ "$stash" -ne 0 ]; then
                        echo "workspace-reclaim: preserving $name (dirty=$dirty unpushed=$unpushed stash=$stash)"
                        continue
                      fi
                    fi
                    echo "workspace-reclaim: reclaiming $name"
                    rm -rf "$ws" || echo "workspace-reclaim: failed $name"
                  done
                fi
                sleep "$interval"
              done
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: workspace
              mountPath: /var/lib/codetether/repos
        - name: harvester
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          image: "registry.quantum-forge.net/cluster-ci-cache/codetether-worker:4.7.5-dev.49-forgejo-ro-599230d97ec3"
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/codetether
          envFrom:
            - secretRef:
                name: harvester-api-keys
          args:
            - worker
            - --server
            - http://a2a-server:8000
            - --workspaces
            - /var/lib/codetether/repos
            - --name
            - "harvester-$(POD_NAME)"
            - --auto-approve
            - "all"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PERSISTENT_WORKER_ENABLED
              value: "true"
            - name: PERSISTENT_WORKER_LEASE_SECONDS
              value: "3600"
            - name: PERSISTENT_WORKER_MAX_TIMEOUT
              value: "604800"
            - name: GITHUB_PROGRESS_ENABLED
              value: "true"
            - name: CODETETHER_HARVESTER_ENABLED
              value: "true"
            - name: CODETETHER_WORKER_A2A_MDNS
              value: "true"
            - name: CODETETHER_WORKER_PUBLIC_URL
              value: "http://$(POD_NAME).a2a-server-harvester.a2a-system.svc.cluster.local:8080"
            - name: CODETETHER_WORKER_PORT
              value: "8080"
            - name: CODETETHER_WORKER_A2A_PORT
              value: "8081"
            - name: CODETETHER_SERVER
              value: http://a2a-server:8000
            - name: CODETETHER_WORKER_CAPABILITIES
              value: "harvester,persistent,persistent-workspace,persistent_workspace,git-clone,repo-cache"
            - name: CODETETHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "a2a-server-worker-token"
                  key: "CODETETHER_TOKEN"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: a2a-server-database
                  key: DATABASE_URL
            - name: HOME
              value: "/var/lib/codetether/repos/.codetether-home"
            - name: XDG_CONFIG_HOME
              value: "/var/lib/codetether/repos/.codetether-home/.config"
            - name: XDG_DATA_HOME
              value: "/var/lib/codetether/repos/.codetether-home/.local/share"
            - name: XDG_CACHE_HOME
              value: "/var/lib/codetether/repos/.codetether-home/.cache"
            - name: CODETETHER_AGENT_HOME
              value: "/var/lib/codetether/repos/.codetether-home/.codetether-agent"
            - name: CODETETHER_HOME
              value: "/var/lib/codetether/repos/.codetether-home/.codetether-agent"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_ROLE
              value: "codetether-harvester"
            - name: VAULT_AUTH_MOUNT
              value: "kubernetes"
            - name: VAULT_K8S_SA_JWT_PATH
              value: "/var/run/secrets/vault/token"
            - name: VAULT_MOUNT
              value: "secret"
            - name: VAULT_SECRETS_PATH
              value: "codetether/providers"
            - name: CODETETHER_DEFAULT_PROVIDER
              value: "openai-codex"
            - name: CODETETHER_DEFAULT_MODEL
              value: "openai-codex/gpt-6-astra-fast:high"
            - name: CODETETHER_OPENAI_CODEX_ALLOW_CHATGPT_BACKEND
              value: "1"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: a2a
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
            requests:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /var/lib/codetether/repos
            - name: workspace
              mountPath: /home/worker
              subPath: .worker-home
            - name: vault-sa-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: vault-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "vault"
                  expirationSeconds: 3600
                  path: token
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
