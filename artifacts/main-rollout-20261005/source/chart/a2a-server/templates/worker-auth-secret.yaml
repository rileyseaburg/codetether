{{- /*
Worker bearer token for /v1/agent/workers* and task polling routes.

Stored in a Secret (never the ConfigMap). Prefer workerAuth.existingSecret so
the token is created out-of-band (Vault/ExternalSecrets/kubectl) and never
passes through Helm values or git.
*/ -}}
{{- if and (not .Values.workerAuth.existingSecret) .Values.workerAuthToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a-server.fullname" . }}-worker-auth
  labels:
    {{- include "a2a-server.labels" . | nindent 4 }}
type: Opaque
data:
  WORKER_AUTH_TOKEN: {{ .Values.workerAuthToken | b64enc | quote }}
{{- end }}
