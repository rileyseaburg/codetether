apiVersion: v1
kind: ConfigMap
metadata:
  name: codetether-a2a-server-config
  labels:
    helm.sh/chart: a2a-server-1.4.3
    app.kubernetes.io/name: a2a-server
    app.kubernetes.io/instance: codetether
    app.kubernetes.io/version: "1.4.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: codetether
data:
  # Server configuration
  A2A_HOST: "0.0.0.0"
  A2A_PORT: "8000"
  A2A_LOG_LEVEL: "INFO"

  # Redis configuration
  A2A_REDIS_URL: "redis://codetether-a2a-server-redis-master:6379"

  # Agent configuration
  A2A_AGENT_NAME: "CodeTether Server"
  A2A_AGENT_DESCRIPTION: "Production CodeTether A2A coordination server"
  A2A_AGENT_ORG: "CodeTether"
  A2A_AGENT_ORG_URL: "https://codetether.run"
  A2A_AGENT_URL: "https://api.codetether.run"
  A2A_AGENT_DOCS_URL: "https://docs.codetether.run"

  # Authentication enabled flag
  A2A_AUTH_ENABLED: "true"

  # Keycloak SSO configuration (non-secret values)
  KEYCLOAK_URL: "https://auth.quantum-forge.io"
  KEYCLOAK_ISSUER: "https://auth.quantum-forge.io/realms/quantum-forge"
  KEYCLOAK_REALM: "quantum-forge"
  KEYCLOAK_CLIENT_ID: "a2a-monitor"

  # Worker authentication token lives in a Secret (worker-auth-secret.yaml).

  # Sandbox execution

  # RLS is enabled by default for multi-tenant isolation
  RLS_ENABLED: "true"

  # Durable Forgejo Temporal orchestration (non-secret client settings)
  FORGEJO_TEMPORAL_ENABLED: "false"

  # Database persistence paths (use mounted volume for persistence across restarts)
  MONITOR_DB_PATH: "/app/data/monitor.db"
  SESSIONS_DB_PATH: "/app/data/sessions.db"
  AGENT_DB_PATH: "/app/data/agent.db"
  # Backward compat: old env var still recognized by the server
  OPENCODE_DB_PATH: "/app/data/agent.db"
