apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codetether-a2a-server
  labels:
    helm.sh/chart: a2a-server-1.4.3
    app.kubernetes.io/name: a2a-server
    app.kubernetes.io/instance: codetether
    app.kubernetes.io/version: "1.4.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: codetether
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: DNT, User-Agent, X-Requested-With,
      If-None-Match, If-Modified-Since, Content-Type, Range, Authorization, X-Tenant-ID,
      X-API-Key
    nginx.ingress.kubernetes.io/cors-allow-methods: GET, PUT, POST, DELETE, PATCH, OPTIONS
    nginx.ingress.kubernetes.io/cors-allow-origin: https://codetether.run, https://docs.codetether.run
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api.codetether.run"
      secretName: a2a-server-tls
  rules:
    - host: "api.codetether.run"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codetether-a2a-server
                port:
                  number: 8000
