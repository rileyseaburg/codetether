      serviceAccountName: t-a2a-server
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: a2a-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          image: registry.quantum-forge.net/cluster-ci-cache/a2a-server-mcp:latest
          imagePullPolicy: Always
          command:
            - python
            - run_server.py
            - run
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --enhanced
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            # MCP is now integrated on the same port under /mcp/* paths
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /.well-known/agent-card.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /.well-known/agent-card.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /.well-known/agent-card.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          envFrom:
            
            - configMapRef:
                name: t-a2a-server-config
          env:
            - name: OPA_LOCAL_MODE
              value: "true"
            - name: OPA_ENABLED
              value: "true"
            
            - name: SPIFFE_ENABLED
              value: "true"
            - name: SPIFFE_TRUST_DOMAIN
              value: "codetether.io"
            - name: SPIFFE_ISSUER
              value: "https://oidc-discovery.codetether.io"
            - name: SPIFFE_WORKER_IDS
              value: "spiffe://codetether.io/ns/a2a-system/sa/a2a-server-harvester"
            - name: SPIFFE_AUDIENCE
              value: "a2a-server"
            - name: SPIFFE_JWKS_URL
              value: "https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local/keys"
            - name: SPIFFE_JWKS_TTL
              value: "300"
            - name: SPIFFE_ALLOW_TOKEN_LEGACY
              value: "true"
            - name: SPIFFE_ROLE_MAP
              value: ""
            - name: SPIFFE_DEFAULT_ROLE
              value: "a2a-agent"
            
            
            - name: A2A_AGENT_DESCRIPTION
              value: "Production A2A coordination server"
            - name: A2A_AGENT_DOCS_URL
              value: "https://docs.codetether.run"
            - name: A2A_AGENT_NAME
              value: "CodeTether Server"
            - name: A2A_AGENT_ORG
              value: "CodeTether"
            - name: A2A_AGENT_ORG_URL
              value: "https://codetether.run"
            - name: A2A_AGENT_URL
              value: "https://api.codetether.run"
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: A2A_LOG_LEVEL
              value: "INFO"
            - name: A2A_PORT
              value: "8000"
            - name: MCP_HTTP_ENABLED
              value: "true"
            - name: MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: MCP_HTTP_PORT
              value: "9000"
            - name: WORKER_INFRA_CACHE_TTL_SECONDS
              value: "30"
            - name: WORKER_INFRA_NODE_MAP
              value: ""
            - name: LIVEKIT_URL
              value: "http://livekit-server.quantum-forge.svc.cluster.local:80"
            - name: LIVEKIT_PUBLIC_URL
              value: "wss://live.quantum-forge.net"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-api-key
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-api-secret
                  key: LIVEKIT_API_SECRET
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: t-a2a-server-data
