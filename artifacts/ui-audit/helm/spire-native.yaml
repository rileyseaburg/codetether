apiVersion: apps/v1
kind: Deployment
metadata:
  name: t-a2a-server-redis
  labels:
    helm.sh/chart: a2a-server-1.4.3
    app.kubernetes.io/name: a2a-server
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "1.4.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a-server
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-server
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
