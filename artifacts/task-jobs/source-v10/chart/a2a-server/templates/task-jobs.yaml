{{- if .Values.taskJobs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "a2a-server.fullname" . }}-task-job-template
data:
  job.json: |
    {
      "apiVersion":"batch/v1","kind":"Job","metadata":{},
      "spec":{"backoffLimit":0,"template":{"metadata":{},"spec":{
        "restartPolicy":"Never",
        "serviceAccountName":{{ printf "%s-harvester" (include "a2a-server.serviceAccountName" .) | toJson }},
        "securityContext":{"runAsNonRoot":true,"runAsUser":1000,"fsGroup":1000},
        "imagePullSecrets":{{ .Values.imagePullSecrets | default list | toJson }},
        "containers":[{
          "name":"worker",
          "image":{{ printf "%s:%s" .Values.harvester.image.repository .Values.harvester.image.tag | toJson }},
          "command":["python3","/runner/job_worker.py"],
          "terminationMessagePath":"/tmp/job-result.json",
          "terminationMessagePolicy":"File",
          "securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}},
          "env":[
            {"name":"PATH","value":"/runner:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"},
            {"name":"CODETETHER_SERVER","value":"http://a2a-server:8000"},
            {"name":"CODETETHER_TOKEN","valueFrom":{"secretKeyRef":{"name":{{ .Values.harvester.tokenSecret.name | toJson }},"key":"CODETETHER_TOKEN"}}},
            {"name":"HOME","value":"/work"},
            {"name":"XDG_CONFIG_HOME","value":"/work/.config"},
            {"name":"XDG_DATA_HOME","value":"/work/.local/share"},
            {"name":"CODETETHER_OPENAI_CODEX_ALLOW_CHATGPT_BACKEND","value":"1"},
            {"name":"CODETETHER_WORKER_TARGETED_ONLY","value":"true"},
            {"name":"CODETETHER_DEFAULT_MODEL","value":{{ .Values.harvester.defaultModel | toJson }}},
            {"name":"VAULT_ADDR","value":{{ .Values.harvester.vault.address | toJson }}},
            {"name":"VAULT_ROLE","value":{{ .Values.harvester.vault.role | toJson }}},
            {"name":"VAULT_AUTH_MOUNT","value":"kubernetes"},
            {"name":"VAULT_K8S_SA_JWT_PATH","value":"/var/run/secrets/vault/token"},
            {"name":"VAULT_MOUNT","value":"secret"},
            {"name":"VAULT_SECRETS_PATH","value":"codetether/providers"},
            {"name":"JOB_RESULT_PATH","value":"/tmp/job-result.json"},
            {"name":"JOB_PRIVATE_LOG_PATH","value":"/work/worker.log"}
          ],
          "volumeMounts":[
            {"name":"runner","mountPath":"/runner","readOnly":true},
            {"name":"home","mountPath":"/work"},
            {"name":"workspace","mountPath":"/var/lib/codetether/repos"},
            {"name":"vault-jwt","mountPath":"/var/run/secrets/vault","readOnly":true}
          ],
          "resources":{"requests":{"cpu":"500m","memory":"2Gi","ephemeral-storage":"6Gi"},
                       "limits":{"cpu":"4","memory":"6Gi","ephemeral-storage":"12Gi"}}
        }],
        "volumes":[
          {"name":"runner","configMap":{"name":{{ printf "%s-task-job-runner" (include "a2a-server.fullname" .) | toJson }},"defaultMode":365}},
          {"name":"home","emptyDir":{"sizeLimit":"8Gi"}},
          {"name":"vault-jwt","projected":{"sources":[{"serviceAccountToken":{"audience":"vault","expirationSeconds":3600,"path":"token"}}]}}
        ]
      }}}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "a2a-server.fullname" . }}-task-job-runner
data:
  job_worker.py: |
{{ .Files.Get "files/job_worker.py" | indent 4 }}
  job_bootstrap.py: |
{{ .Files.Get "files/job_bootstrap.py" | indent 4 }}
  codetether: |
{{ .Files.Get "files/codetether_safe_help.py" | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "a2a-server.fullname" . }}-task-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "a2a-server.fullname" . }}-task-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "a2a-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "a2a-server.fullname" . }}-task-jobs
  apiGroup: rbac.authorization.k8s.io
{{- end }}