{{- if .Values.reviewHarvester.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "a2a-server.fullname" . }}-review-harvester
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: review-harvester
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: review-harvester
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: {{ include "a2a-server.serviceAccountName" . }}-harvester
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: harvester
          image: "{{ .Values.harvester.image.repository }}:{{ .Values.harvester.image.tag }}"
          command: ["/usr/local/bin/codetether"]
          args: ["worker", "--server", "http://a2a-server:8000", "--name", "harvester-pr-review", "--workspaces", "/review", "--auto-approve", "safe", "--max-concurrent-tasks", "2"]
          env:
            - name: HOME
              value: /review
            - name: XDG_CONFIG_HOME
              value: /review/.config
            - name: XDG_DATA_HOME
              value: /review/.local/share
            - name: CODETETHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.harvester.tokenSecret.name | default (printf "%s-worker-token" (include "a2a-server.fullname" .)) }}
                  key: {{ .Values.harvester.tokenSecret.key | default "CODETETHER_TOKEN" }}
            - name: CODETETHER_WORKER_TARGETED_ONLY
              value: "true"
            - name: CODETETHER_OPENAI_CODEX_ALLOW_CHATGPT_BACKEND
              value: {{ ternary "1" "0" .Values.reviewHarvester.allowChatGPTBackend | quote }}
            - name: CODETETHER_WORKER_CAPABILITIES
              value: "review-readonly"
            - name: CODETETHER_DEFAULT_MODEL
              value: {{ .Values.harvester.defaultModel | quote }}
            - name: VAULT_ADDR
              value: {{ .Values.harvester.vault.address | default "http://vault.vault.svc.cluster.local:8200" | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.harvester.vault.role | default "codetether-harvester" | quote }}
            - name: VAULT_AUTH_MOUNT
              value: "kubernetes"
            - name: VAULT_K8S_SA_JWT_PATH
              value: "/var/run/secrets/vault/token"
            - name: VAULT_MOUNT
              value: "secret"
            - name: VAULT_SECRETS_PATH
              value: "codetether/providers"
          volumeMounts:
            - name: scratch
              mountPath: /review
            - name: vault-jwt
              mountPath: /var/run/secrets/vault
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
      volumes:
        - name: scratch
          emptyDir: {}
        - name: vault-jwt
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
{{- end }}