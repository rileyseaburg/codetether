              registry_username=${decoded_auth%%:*}
              registry_password=${decoded_auth#*:}
              printf '{"auths":{"registry.quantum-forge.net":{"auth":"%s"},"harbor-registry.container-registry.svc.cluster.local:5000":{"auth":"%s"}}}\n' "$harbor_auth" "$harbor_auth" > /root/.docker/config.json
              printf 'REGISTRY_USERNAME=%s\nREGISTRY_PASSWORD=%s\n' "$registry_username" "$registry_password" >> /data/job-env
              echo configured-kubernetes-harbor-auth-for-act-runner
            fi
          fi
          printf 'VAULT_ADDR=%s\n' 'http://vault.vault.svc.cluster.local:8200' >> /data/job-env
          printf 'VAULT_TOKEN=%s\n' "$(cat /vault/runtime/token)" >> /data/job-env
          if [ -n "${GITOPS_SSH_PRIVATE_KEY:-}" ]; then
