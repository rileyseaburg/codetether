{{- /*
spiffe-helper config for SPIRE-native task Jobs.

The helper talks to the SPIRE agent through the SPIFFE CSI Workload API
socket and keeps /svid/jwt_svid.token fresh (audience = the A2A server), so
the worker authenticates with a short-lived, auto-rotated JWT-SVID instead of
a shared CODETETHER_TOKEN.
*/ -}}
{{- if and .Values.taskJobs.enabled .Values.spiffe.enabled .Values.spiffe.workloadApi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "a2a-server.fullname" . }}-spiffe-helper
  labels:
    {{- include "a2a-server.labels" . | nindent 4 }}
data:
  helper.conf: |
    agent_address = {{ .Values.spiffe.workloadApi.socketPath | quote }}
    cert_dir = "/svid"
    daemon_mode = true
    jwt_svids = [{jwt_audience = {{ (splitList "," .Values.spiffe.audience | first) | trim | quote }}, jwt_svid_file_name = "jwt_svid.token"}]
    jwt_svid_file_mode = 0600
{{- end }}
