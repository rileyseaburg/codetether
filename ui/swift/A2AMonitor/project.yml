name: A2AMonitor
options:
  bundleIdPrefix: com.a2a
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  DEVELOPMENT_TEAM: "J9YRM3U37D"
  CODE_SIGN_STYLE: Manual
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: "2.0.0"
targets:
  A2AMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources/A2AMonitor
    dependencies:
      - package: LiveKit
        product: LiveKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.a2a.monitor
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_IDENTITY: "Apple Development"
      PROVISIONING_PROFILE_SPECIFIER: "debug1"
  A2AMonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
      - path: Sources/A2AMonitor/Services/LoginFailure.swift
    dependencies:
      - target: A2AMonitor
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.a2a.monitor.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: A2AMonitor
  A2AMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: A2AMonitor
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.a2a.monitor.tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  A2AMonitor:
    build:
      targets:
        A2AMonitor: all
        A2AMonitorUITests: [test]
        A2AMonitorTests: [test]
    test:
      environmentVariables:
        A2A_LIVE_SIMULATOR_TEST: "$(A2A_LIVE_SIMULATOR_TEST)"
      targets:
        - A2AMonitorUITests
        - A2AMonitorTests